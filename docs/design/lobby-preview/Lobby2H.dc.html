    <section style="position: absolute; left: 804px; top: 236px; box-sizing: border-box; width: 480px; padding: 20px 22px 18px; border: 3px solid #826b4f; border-radius: 28px; background: #c9a873; color: #3b2f2a; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), inset 0 -4px 0 rgba(0, 0, 0, 0.12), 0 18px 48px rgba(0, 0, 0, 0.45);">
