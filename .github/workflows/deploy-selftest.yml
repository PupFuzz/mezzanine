# deploy-selftest.yml — keep bin/deploy.sh's refusals real, at PR time.
#
# WHAT IT DOES. Runs `bin/deploy.selftest.sh` over this checkout: every precondition refusal, the
# down-and-stay-down path, the anti-"bare re-run" guard, the daemon restarts and the load-bearing
# cache order, each against a throwaway git fixture with php/composer/npm/systemctl/curl stubbed
# on PATH. It deploys nothing and reaches no host — there is no host (docs/PLAN.md D-08).
#
# WHY IT EXISTS. card#7459's acceptance is that the script is "seen to fail on a broken
# precondition before trusted", and that property decays silently: a refusal that stops firing
# looks exactly like a host that is in good order. The first place anyone would find out is a
# production maintenance window. The suite that proves the checks discriminate is worth nothing
# if it only ever ran on the day it was written.
#
# NO `paths:` FILTER, DELIBERATELY — the same reasoning as `asset-provenance.yml`: the suite is
# seconds of bash, and a path-filtered workflow produces NO RUN, which reads as *pending* rather
# than *passed* if this check is ever promoted to required. It is also not filtered to
# `bin/deploy*` because the script asserts things about `server/` (migrations that ALTER `events`,
# `bootstrap/app.php`'s trusted proxies) — a PR that never touches bin/ can still change what the
# gate would say.
#
# ⚠ THIS IS NOT A REQUIRED STATUS CHECK. `docs/VERSIONING.md § Branch model`: `card-token-lint` is
# the only mechanically required check on `dev` and `main`, and a workflow added later is not
# automatically required. A red here does not block a merge — a human has to look. card#7344 owns
# the required-check list.
#
# NEEDS NO CREDENTIAL AND NO NETWORK. bash + git + the checkout, nothing else.

name: Deploy selftest

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `bash` explicitly rather than relying on the executable bit surviving a checkout: the
      # suite is the evidence, so it must fail on its own assertions and never on a file mode.
      - name: Self-test (every refusal exercised against the real script)
        run: bash bin/deploy.selftest.sh
