# deploy-selftest.yml — keep bin/deploy.sh's refusals real, at PR time.
#
# WHAT IT DOES. Runs `bin/deploy.selftest.sh` over this checkout: every precondition refusal, the
# down-and-stay-down path, the anti-"bare re-run" guard, the daemon restarts and the load-bearing
# cache order, each against a throwaway git fixture with php/php-fpm/composer/npm/crontab/curl
# stubbed on PATH — and the daemon restart itself run for real (flock, fuser, setsid, kill) against
# stub daemons inside the temp dir. It deploys nothing and reaches no host; the prod host (docs/PLAN.md
# D-08) has never been deployed to.
#
# WHY IT EXISTS. card#7459's acceptance is that the script is "seen to fail on a broken
# precondition before trusted", and that property decays silently: a refusal that stops firing
# looks exactly like a host that is in good order. The first place anyone would find out is a
# production maintenance window. The suite that proves the checks discriminate is worth nothing
# if it only ever ran on the day it was written.
#
# NO `paths:` FILTER, DELIBERATELY — the same reasoning as `asset-provenance.yml`: the suite is
# seconds of bash, and a path-filtered workflow produces NO RUN, which reads as *pending* rather
# than *passed* for a required check. It is also not filtered to `bin/deploy*` because the script
# asserts things about `server/` (migrations that ALTER `events`, `bootstrap/app.php`'s trusted
# proxies) — a PR that never touches bin/ can still change what the gate would say.
#
# ⛔ WHETHER A RED HERE BLOCKS A MERGE IS NOT STATED IN THIS FILE, DELIBERATELY. A required-check
# list is a repository-settings fact that no file in the checkout can verify, and copies of it in
# workflow headers have already gone stale in this repo, in the direction that tells a reviewer to
# ignore a red. `docs/VERSIONING.md § Branch model` is its one home and carries the command that
# re-derives it from the API. Read that; do not re-copy it here.
#
# This block used to assert the opposite — that `card-token-lint` was *the only* mechanically
# required check on `dev` and `main`, so a red here did not block a merge, with card#7344 named as
# owning the list. Measured (card#9054): the *only* was false — `card-token-lint` is one of
# several — and card#7344 is the app-code CI-lane card, which owns no part of the list, so the
# comment also pointed a future maintainer at a card that would never address it. What IS true and
# stays: requiring a check is a repository-settings act, so a workflow added later is not
# automatically required — which is exactly why a copy here rots.
#
# NEEDS NO CREDENTIAL AND NO NETWORK. bash + git + util-linux (flock, setsid) + psmisc (fuser) +
# the checkout, nothing else.

name: Deploy selftest

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `bash` explicitly rather than relying on the executable bit surviving a checkout: the
      # suite is the evidence, so it must fail on its own assertions and never on a file mode.
      - name: Self-test (every refusal exercised against the real script)
        run: bash bin/deploy.selftest.sh

  # ── the mirror, held against the parser it mirrors ──────────────────────────────────────────────────
  # `bin/deploy.sh` re-implements, in bash, the part of vlucas/phpdotenv that decides where a `.env` line
  # ENDS, whether a line is a SETTING and what the app then RECEIVES for it — because at phase A it cannot
  # ask PHP (the config cache is stale by construction and the host may have no working app). Every one of
  # those is a claim about somebody else's code, and card#9561 round 4 is what a false one costs: a lone
  # `\r` made a `.env` two lines to Dotenv and one to the reader that decides, so Laravel went to a remote
  # store in plaintext while A5 read DB_HOST as unset and exempted the store from TLS. `bin/env-mirror-diff.sh`
  # is the differential that found it, landed — so a phpdotenv upgrade that moves the parser out from under
  # the mirror reds HERE, on a PR, instead of inside a maintenance window.
  #
  # A SEPARATE JOB, not a step of the one above, for two reasons. It is the only thing in this workflow
  # that needs PHP and an installed `server/vendor/`, and a `composer install` in front of `deploy.selftest.sh`
  # would make the fast lane wait on it. And GitHub runs the two in PARALLEL, so what this adds to a PR's
  # critical path is nothing while it finishes inside the self-test above.
  #
  # `server/vendor/` IS THE ORACLE, so it is installed from the committed lock rather than stubbed: a
  # re-implementation of phpdotenv here would be a second copy of the very thing under test. The floor is
  # DERIVED from `server/composer.json` by the same tool `php-tests.yml` uses (card#9203 is what a retyped
  # copy of it cost), and `pdo_mysql` is load-bearing rather than incidental — without the driver
  # `server/config/database.php` builds no `options` array at all, the CA axis reports "no CA" for every
  # fixture and agrees with anything. The harness refuses to run rather than report that.
  env-mirror-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive the PHP floor from server/composer.json, and check it against the lock
        id: php-floor
        run: python3 tools/verify-php-floor.py --github-output

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ steps.php-floor.outputs.minor }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Locate composer's download cache
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-

      # `install`, never `update`: the lock is the authority, and the parser this compares against must be
      # the one a deploy would actually put on the host. `--no-dev` because nothing here needs a dev tool.
      - name: Install server/'s dependencies — this vendor tree is the oracle
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      # No real `.env` is created or read: every fixture is written into the harness's own temp dir, and
      # the mirror that PRINTS `.env` values is bounded to that dir through `MEZZ_ENV_MIRROR_WORK`, with
      # the bound's own refusal watched in the run below. What a green run does NOT prove about the key
      # population is stated in `bin/env-mirror-diff.sh`'s header and recorded on card#9591.
      - name: The mirror agrees with the parser, and every control reds when mutated
        run: bash bin/env-mirror-diff.sh
