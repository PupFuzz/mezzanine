# deploy-selftest.yml — keep bin/deploy.sh's refusals real, at PR time.
#
# WHAT IT DOES. Runs `bin/deploy.selftest.sh` over this checkout: every precondition refusal, the
# down-and-stay-down path, the anti-"bare re-run" guard, the daemon restarts and the load-bearing
# cache order, each against a throwaway git fixture with php/php-fpm/composer/npm/crontab/curl
# stubbed on PATH — and the daemon restart itself run for real (flock, fuser, setsid, kill) against
# stub daemons inside the temp dir. It deploys nothing and reaches no host; the prod host (docs/PLAN.md
# D-08) has never been deployed to.
#
# AND IT MEASURES THE BASH FLOOR (card#9616, the `bash-floor` job below): the same suite under a bash
# built at the `BASH_FLOOR` that `bin/deploy.sh` declares, which must pass, and under the minor below
# it, which must fail. That pair is what makes the declared floor a measurement rather than a claim.
#
# WHY IT EXISTS. card#7459's acceptance is that the script is "seen to fail on a broken
# precondition before trusted", and that property decays silently: a refusal that stops firing
# looks exactly like a host that is in good order. The first place anyone would find out is a
# production maintenance window. The suite that proves the checks discriminate is worth nothing
# if it only ever ran on the day it was written.
#
# NO `paths:` FILTER, DELIBERATELY — the same reasoning as `asset-provenance.yml`: the suite is
# seconds of bash, and a path-filtered workflow produces NO RUN, which reads as *pending* rather
# than *passed* for a required check. It is also not filtered to `bin/deploy*` because the script
# asserts things about `server/` (migrations that ALTER `events`, `bootstrap/app.php`'s trusted
# proxies) — a PR that never touches bin/ can still change what the gate would say.
#
# ⛔ WHETHER A RED HERE BLOCKS A MERGE IS NOT STATED IN THIS FILE, DELIBERATELY. A required-check
# list is a repository-settings fact that no file in the checkout can verify, and copies of it in
# workflow headers have already gone stale in this repo, in the direction that tells a reviewer to
# ignore a red. `docs/VERSIONING.md § Branch model` is its one home and carries the command that
# re-derives it from the API. Read that; do not re-copy it here.
#
# This block used to assert the opposite — that `card-token-lint` was *the only* mechanically
# required check on `dev` and `main`, so a red here did not block a merge, with card#7344 named as
# owning the list. Measured (card#9054): the *only* was false — `card-token-lint` is one of
# several — and card#7344 is the app-code CI-lane card, which owns no part of the list, so the
# comment also pointed a future maintainer at a card that would never address it. What IS true and
# stays: requiring a check is a repository-settings act, so a workflow added later is not
# automatically required — which is exactly why a copy here rots.
#
# NO CREDENTIAL IS NEEDED BY ANY JOB HERE. The `deploy-selftest` job needs no network either:
# bash + git + util-linux (flock, setsid) + psmisc (fuser) + the checkout, nothing else.
# `env-mirror-differential` and `bash-floor` DO reach the network — packagist and ftp.gnu.org
# respectively — and each says at its own header what it fetches and what a failed fetch means.

name: Deploy selftest

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # § card#9932's block-full-filesystem cases need an UNPRIVILEGED USER NAMESPACE
      # (`unshare -Ur -m`), and Ubuntu 24.04 restricts those by default through an AppArmor
      # policy — measured on this job (CI run 35678901985): `unshare: write failed
      # /proc/self/uid_map: Operation not permitted`, where the same suite made one locally
      # (card#9932 review). The sysctl below is a CANDIDATE lever, recalled rather than sourced from
      # a citation checked here; it is UNVERIFIED IN THIS CHANGE — nothing in this sandbox reproduces
      # an AppArmor-restricted runner to try it against — so the step below is followed by the gate
      # that finds out for real (§ NOT VERIFIED, below): if this does not lift the restriction, that
      # step fails loudly instead of the section going quiet.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # `bash` explicitly rather than relying on the executable bit surviving a checkout: the
      # suite is the evidence, so it must fail on its own assertions and never on a file mode.
      #
      # ⛔ NOT VERIFIED HERE ON THIS ONE SECTION IS A HARD FAILURE, deliberately (card#9932 review,
      # SF-1): `bin/deploy.selftest.sh`'s own exit code does not red on a NOT VERIFIED line — that
      # is the whole point of the distinction (card#9646), an honest "this did not run" rather than
      # a false pass — but a suite worth nothing if it only ever ran on the day it was written is
      # worth just as little if a later revert of the write probe can stay green here because this
      # ONE property silently never runs on CI. Grepped rather than reasoned about: a probe revert
      # would still pass every OTHER assertion the block-full section makes as long as the section
      # itself is skipped, so nothing but a positive check on its own having run catches that.
      - name: Self-test (every refusal exercised against the real script)
        run: |
          set -o pipefail
          bash bin/deploy.selftest.sh 2>&1 | tee /tmp/selftest.log
          if grep -q 'NOT VERIFIED HERE  card#9932: a filesystem out of BLOCKS could not be produced on this runner' /tmp/selftest.log; then
            echo "::error::the card#9932 block-full-filesystem section did NOT run on this runner (NOT VERIFIED, above) — an unprivileged user namespace could not be made even after the AppArmor step. This is a hard failure: those cases are the only ones that make the write probe actually FAIL rather than trust it, and a suite that quietly never runs them is worth nothing (§ this job's own header). Fix what unshare needs on this runner, or replace the sysctl step above with whatever this runner's image actually requires."
            exit 1
          fi

  # ── the bash floor, MEASURED — and measured to be the floor, not merely to be met (card#9616) ──
  # `bin/deploy.sh` declares `BASH_FLOOR`. THIS JOB IS WHAT MAKES THAT NUMBER A MEASUREMENT rather
  # than an assertion: it runs the whole self-test under a bash built at the declared floor, which
  # must PASS, and again under the minor BELOW it, which must FAIL. A floor with only the first leg
  # is a claim nobody tried to falsify — the run below it is the control (canon #9), and a job whose
  # control cannot fail is a decoration.
  #
  # ⛔ THE BELOW-FLOOR RUN LOWERS `BASH_FLOOR` IN ITS OWN COPY OF THE TREE, ON PURPOSE. Left alone,
  # A1 would refuse every fixture for being below the floor and the run would fail for the GATE's
  # reason — which proves the gate works and says nothing about the floor. Lowered, the gate is out
  # of the way and what remains to fail is the script meeting bash's real limits. Measured 2026-09-19
  # on the author's box, this is what that looks like: at 4.3 the failures are A7's
  # `'<ref>' does not resolve to a commit` refusal DYING on `"${ref_note[@]}"` — an empty array
  # expanded under `set -u` — with no ⛔ banner and no "Nothing was changed" promise.
  #
  # ⚠ WHY A SOURCE BUILD AND NOT `docker run bash:$BASH_FLOOR`. The `bash:4.x` images exist and are
  # current (verified 2026-09-19: `bash:4.4` and `bash:4.3` are rebuilt on alpine3.22), but they are
  # busybox + musl userland, and this suite needs GNU `sed -i`, `readlink -f`, `git`, `php`, `ps`,
  # `fuser`, `flock` and `setsid` to run AT ALL — so a container run would measure a SUBSET and
  # report the rest as not verified, which is a weaker measurement than the one below. And a Docker
  # Hub TAG IS MUTABLE (`bash:4.4` was rebuilt the day this was written), so pinning the measurement
  # to it makes the floor's evidence drift silently; the GNU release tarball and its sha256 do not
  # move. The ubuntu-latest runner supplies the same GNU userland the deploy's real host has.
  #
  # NEEDS NETWORK (ftp.gnu.org) AND A COMPILER, and nothing else — no credential, no registry login.
  # A download or a build that fails FAILS THE JOB: an unbuilt shell measures nothing, and a step
  # that cannot run is never a pass.
  bash-floor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # § card#9932's block-full-filesystem cases, exercised again here under the floor bash — see
      # the `deploy-selftest` job's own step of this name for what this is and why it is unverified
      # in this change. One step covers both suite runs below: the sysctl is process-VM-wide, not
      # per-shell, so it does not need repeating for the below-floor control.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # DERIVED from bin/deploy.sh, through bin/deploy.sh's OWN reader (`bash_floor_declared`) and
      # its OWN validator (`bash_floor_is_version`) — the two A1 and A6b use — never by a pattern
      # of this file's. A second pattern here is the restatement that drifts away from the gate it
      # claims to measure, and card#9984 is what that costs: the copies of "is this a floor?" had
      # drifted apart, and A1's was loose enough to pass `4,4` and read it as 4.0.
      - name: Read BASH_FLOOR out of bin/deploy.sh, with the script's own reader and validator
        id: floor
        run: |
          set -Eeuo pipefail
          floor="$( . ./bin/deploy.sh >/dev/null 2>&1; bash_floor_declared < bin/deploy.sh )"
          [ -n "$floor" ] || { echo "::error::bin/deploy.sh declares no BASH_FLOOR — nothing to measure, and an empty derivation is never a pass"; exit 1; }
          # A THREE-COMPONENT FLOOR IS NAMED AS ITSELF, before the general test, because the
          # remedy differs: `4.4.1` is a floor somebody meant, written with a field this job (and
          # A1, and A6b) does not compare. The general refusal below would say only "not
          # <major>.<minor>", which is true and less useful.
          case "$floor" in
            *.*.*) echo "::error::BASH_FLOOR='$floor' has three components; this job compares <major>.<minor>, which is what A1 and A6b compare too. Declare the floor as <major>.<minor>."; exit 1 ;;
          esac
          ( . ./bin/deploy.sh >/dev/null 2>&1; bash_floor_is_version "$floor" ) \
            || { echo "::error::BASH_FLOOR='$floor' is not <major>.<minor> — bin/deploy.sh's own bash_floor_is_version refuses it, so A1 would refuse this tree before anything is touched and there is nothing here to measure"; exit 1; }
          major="${floor%%.*}"; minor="${floor#*.}"
          # The control is the minor BELOW. A floor at `.0` has no predecessor this arithmetic can
          # name, so it stops rather than measuring the wrong pair.
          [ "$minor" -gt 0 ] || { echo "::error::BASH_FLOOR=$floor ends in .0 — name its predecessor release here deliberately"; exit 1; }
          below="$major.$((minor - 1))"
          echo "floor=$floor"  >> "$GITHUB_OUTPUT"
          echo "below=$below"  >> "$GITHUB_OUTPUT"
          echo "bin/deploy.sh declares BASH_FLOOR=$floor; the control runs at $below"

      # Two shells, from the GNU release tarballs, each pinned by sha256 — the checksums were read
      # from ftp.gnu.org and cross-checked against mirrors.kernel.org, so the pin is a transport
      # check and not a second copy of a number nobody verified. An unpinned download compiled and
      # RUN in CI is the shape this avoids.
      - name: Build GNU bash at the floor and at the minor below it
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          BELOW: ${{ steps.floor.outputs.below }}
        run: |
          set -Eeuo pipefail
          # <version> <sha256 of bash-<version>.tar.gz on ftp.gnu.org>. A floor that MOVES adds its
          # row here and its predecessor's, deliberately — which is the same act as re-measuring.
          # (Written with printf rather than a heredoc: a heredoc terminator cannot sit at column 0
          # inside a YAML block scalar, and an indented one does not terminate.)
          printf '%s\n' \
            '4.3 afc687a28e0e24dc21b988fa159ff9dbcf6b7caa92ade8645cc6d5605cd024d4' \
            '4.4 d86b3392c1202e8ff5a423b302e6284db7f8f435ea9f39b5b1b20fd3ac36dfcb' \
            > /tmp/bash-sha256
          for v in "$FLOOR" "$BELOW"; do
            sum="$(awk -v v="$v" '$1 == v { print $2 }' /tmp/bash-sha256)"
            [ -n "$sum" ] || { echo "::error::no pinned sha256 for bash $v — add it above, from ftp.gnu.org"; exit 1; }
            curl -fsSL --retry 3 -o "/tmp/bash-$v.tar.gz" "https://ftp.gnu.org/gnu/bash/bash-$v.tar.gz"
            printf '%s  /tmp/bash-%s.tar.gz\n' "$sum" "$v" | sha256sum -c -
            mkdir -p "/tmp/src-$v"
            tar xzf "/tmp/bash-$v.tar.gz" -C "/tmp/src-$v" --strip-components=1
            # A 2009–2016 C codebase under a 2020s gcc: the CFLAGS demote back to warnings the
            # diagnostics that became errors by default. Nothing there changes what bash DOES.
            # The whole build goes to a log and only its tail is printed, and only on failure —
            # the warnings are real and thousands of lines of them would bury this job's evidence.
            ( cd "/tmp/src-$v"
              ./configure --prefix="/tmp/bash-$v" --without-bash-malloc --disable-nls \
                CFLAGS="-O1 -std=gnu89 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-return-mismatch" \
                && make -j"$(nproc)" && make install ) > "/tmp/build-$v.log" 2>&1 \
              || { echo "::error::building bash $v failed — the last lines of /tmp/build-$v.log follow. An unbuilt shell measures nothing, so this is never a pass."; tail -40 "/tmp/build-$v.log"; exit 1; }
            mkdir -p "/tmp/path-$v"; ln -sf "/tmp/bash-$v/bin/bash" "/tmp/path-$v/bash"
            echo "built: $("/tmp/bash-$v/bin/bash" -c 'echo "$BASH_VERSION"')"
          done

      # AT THE FLOOR: the whole suite, with that bash FIRST ON PATH so the re-exec after the
      # checkout runs the same interpreter rather than the runner's own. It must pass.
      # ⛔ NOT VERIFIED HERE ON card#9932's BLOCK-FULL SECTION IS A HARD FAILURE HERE TOO — same
      # reasoning as the `deploy-selftest` job's own step of this name; not restated.
      - name: The suite passes on bash ${{ steps.floor.outputs.floor }} — the floor
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -Eeuo pipefail
          "/tmp/bash-$FLOOR/bin/bash" -c 'echo "measuring with: $BASH_VERSION"'
          PATH="/tmp/path-$FLOOR:$PATH" "/tmp/bash-$FLOOR/bin/bash" bin/deploy.selftest.sh 2>&1 | tee /tmp/floor-run.log
          if grep -q 'NOT VERIFIED HERE  card#9932: a filesystem out of BLOCKS could not be produced on this runner' /tmp/floor-run.log; then
            echo "::error::the card#9932 block-full-filesystem section did NOT run on bash $FLOOR — see the deploy-selftest job's step of this name for what that means and why it is a hard failure."
            exit 1
          fi

      # THE CONTROL, one minor below — in a COPY of the tree whose BASH_FLOOR is lowered to match,
      # so the gate is not what stops it. It must FAIL, and this step fails if it passes.
      - name: The same suite FAILS on bash ${{ steps.floor.outputs.below }} — the control
        env:
          BELOW: ${{ steps.floor.outputs.below }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/below-tree && cp -a "$GITHUB_WORKSPACE" /tmp/below-tree
          sed -i "s/^BASH_FLOOR=.*/BASH_FLOOR=$BELOW/" /tmp/below-tree/bin/deploy.sh
          # ⛔ ASSERTED, NOT PRINTED. If that `sed` ever stops matching, A1 and A6b refuse every
          # fixture (mkfix copies the working-tree deploy.sh into the fixture's target commit, so the
          # two floors move together), the suite reds FOR THE GATE'S REASON — the one thing lowering
          # the floor exists to avoid — and a bare `grep -n` would print the untouched line and exit 0
          # while this step declared the control discriminating. `-x` so a line that merely CONTAINS
          # the value cannot satisfy it.
          grep -qx "BASH_FLOOR=$BELOW" /tmp/below-tree/bin/deploy.sh \
            || { echo "::error::the below-floor tree still does not declare BASH_FLOOR=$BELOW, so this run would measure the GATE refusing rather than the constructs failing. The sed above did not match; fix it before reading anything into the result."; grep -n '^BASH_FLOOR=' /tmp/below-tree/bin/deploy.sh || true; exit 1; }
          "/tmp/bash-$BELOW/bin/bash" -c 'echo "measuring with: $BASH_VERSION"'
          rc=0
          ( cd /tmp/below-tree && PATH="/tmp/path-$BELOW:$PATH" "/tmp/bash-$BELOW/bin/bash" bin/deploy.selftest.sh ) \
            > /tmp/below-run.log 2>&1 || rc=$?
          tail -40 /tmp/below-run.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::bin/deploy.sh's self-test PASSED on bash $BELOW, so $FLOOR is not the floor — it is merely a version that works. Lower BASH_FLOOR to what the suite really needs, or find the construct that should have failed here."
            exit 1
          fi
          # ⛔ AND THE OUTCOME IS ASSERTED, NOT THE EXIT CODE. Any non-zero rc would otherwise read as
          # discrimination — including a run that died for a reason with nothing to do with bash's
          # version (a harness construct, a runner image change, a tool that stopped being installed).
          # The suite's own summary line is the evidence that it RAN and that its ASSERTIONS are what
          # failed; a run that never reached the summary measured nothing.
          grep -Eq 'assertions, [0-9]+ FAILED$' /tmp/below-run.log \
            || { echo "::error::the below-floor run exited $rc without reaching its own 'N assertions, M FAILED' summary, so it did not measure the floor — it broke. The tail above is what it printed; this is never a pass."; exit 1; }
          echo "control discriminated: on bash $BELOW the suite ran and its own assertions failed — $(grep -Eo 'assertions, [0-9]+ FAILED$' /tmp/below-run.log) — where on bash $FLOOR the same suite passed in full."
          echo "the assertions the control reds on, deduplicated — read them for HOW MANY SITES they come from, since a denominator of one would make the floor unfalsifiable:"
          grep -E '^  FAIL ' /tmp/below-run.log | sed 's/ —.*//' | sort -u

  # ── the mirror, held against the parser it mirrors ──────────────────────────────────────────────────
  # `bin/deploy.sh` re-implements, in bash, the part of vlucas/phpdotenv that decides where a `.env` line
  # ENDS, whether a line is a SETTING and what the app then RECEIVES for it — because at phase A it cannot
  # ask PHP (the config cache is stale by construction and the host may have no working app). Every one of
  # those is a claim about somebody else's code, and card#9561 round 4 is what a false one costs: a lone
  # `\r` made a `.env` two lines to Dotenv and one to the reader that decides, so Laravel went to a remote
  # store in plaintext while A5 read DB_HOST as unset and exempted the store from TLS. `bin/env-mirror-diff.sh`
  # is the differential that found it, landed — so a phpdotenv upgrade that moves the parser out from under
  # the mirror reds HERE, on a PR, instead of inside a maintenance window.
  #
  # A SEPARATE JOB, not a step of the one above, for two reasons. It is the only thing in this workflow
  # that needs PHP and an installed `server/vendor/`, and a `composer install` in front of `deploy.selftest.sh`
  # would make the fast lane wait on it. And GitHub runs the two in PARALLEL, so what this adds to a PR's
  # critical path is nothing while it finishes inside the self-test above.
  #
  # `server/vendor/` IS THE ORACLE, so it is installed from the committed lock rather than stubbed: a
  # re-implementation of phpdotenv here would be a second copy of the very thing under test. The floor is
  # DERIVED from `server/composer.json` by the same tool `php-tests.yml` uses (card#9203 is what a retyped
  # copy of it cost), and `pdo_mysql` is load-bearing rather than incidental — without the driver
  # `server/config/database.php` builds no `options` array at all, the CA axis reports "no CA" for every
  # fixture and agrees with anything. The harness refuses to run rather than report that.
  env-mirror-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive the PHP floor from server/composer.json, and check it against the lock
        id: php-floor
        run: python3 tools/verify-php-floor.py --github-output

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ steps.php-floor.outputs.minor }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Locate composer's download cache
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-

      # `install`, never `update`: the lock is the authority, and the parser this compares against must be
      # the one a deploy would actually put on the host. `--no-dev` because nothing here needs a dev tool.
      - name: Install server/'s dependencies — this vendor tree is the oracle
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      # No real `.env` is created or read: every fixture is written into the harness's own temp dir, and
      # the mirror that PRINTS `.env` values is bounded to that dir through `MEZZ_ENV_MIRROR_WORK`, with
      # the bound's own refusal watched in the run below. What a green run does NOT prove about the key
      # population is stated in `bin/env-mirror-diff.sh`'s header and recorded on card#9591.
      - name: The mirror agrees with the parser, and every control reds when mutated
        run: bash bin/env-mirror-diff.sh
