# deploy-gate-inputs.yml — does THIS repository pass bin/deploy.sh's own phase-A gates? card#9637, card#9745
#
# WHAT IT DOES. Runs `bin/deploy-gate-inputs.sh` over the commit under test: it RUNS the target-tree
# gates that commit's OWN `bin/deploy.sh` declares host-free (GATE_TREE_READERS), with the deploy's read
# ledger on, and reds when one of them refuses the commit — which is the refusal a real deploy of that
# commit makes at phase A, on any host. It deploys nothing, reaches no host, opens no `.env` and needs no
# credential — git and bash over the object database.
#
# ⛔ SINCE card#9745 IT ASSERTS THE GATES' CONTENT PREDICATES, not only that their files are present: an
# `ALTER` on `events` with no `ALGORITHM=`, a `trustProxies('*')`, a PHP constraint A6 cannot evaluate, a
# lockfileVersion A12 cannot map. Operator ruling, card#9745 comment 5701. A red names the deploy gate
# that refused and prints its own reason.
#
# WHY IT EXISTS. `bin/deploy.sh`'s A12 required `server/package-lock.json`, a file this repository
# had never contained, so every real deploy refused at phase A from the day that gate landed — and
# kept refusing through three fix rounds and four adversarial reviews of the script. `deploy-selftest`
# was green the whole time and structurally had to be: it runs the gates against FIXTURE repositories
# and its fixtures mint a lockfile, so it proves the gate behaves correctly given a well-formed
# release and says nothing about whether this repo IS one. The suite's fixtures were more complete
# than the repository. Nothing else in CI ever put the deploy's demands and this tree in the same
# room. That is the gap this lane closes.
#
# THE CHECK ITSELF IS CHECKED FIRST. `bin/deploy-gate-inputs.selftest.sh` runs FIRST below: it builds
# fixture repositories from this checkout, changes ONE thing in each, and watches the check answer —
# each content predicate red beside a control, a bare `git` inside a gate stopping it, a reader the
# declaration does not name stopping it, and the exit-1/exit-2 line between a finding about the
# release and the check having failed. A verdict from a check that no longer discriminates is worth
# nothing, in either direction.
#
# ⛔ WHAT A GREEN HERE DOES NOT ESTABLISH IS NAMED IN ONE PLACE — the `NOT PROVED BY A GREEN` block the
# check PRINTS in the log of the run below. This header keeps no copy of it.

# NO `paths:` FILTER, DELIBERATELY — the same reasoning as `deploy-selftest.yml`: it is seconds of
# bash with no service to stand up, and a path-filtered workflow produces NO RUN, which reads as
# *pending* rather than *passed* for a required check. Filtering on `bin/deploy*` would also be wrong in both directions: a PR that
# deletes `server/composer.json` and touches no `bin/` file is exactly what this must catch.
#
# ⛔ WHETHER A RED HERE BLOCKS A MERGE IS NOT STATED IN THIS FILE, DELIBERATELY. A required-check
# list is a repository-settings fact that no file in the checkout can verify, and copies of it in
# workflow headers have already gone stale in this repo (card#9054), in the direction that tells a
# reviewer to ignore a red. `docs/VERSIONING.md § Branch model` is its one home and carries the
# command that re-derives it from the API.

name: Deploy gate inputs

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy-gate-inputs:
    runs-on: ubuntu-latest
    steps:
      # Depth 1 is enough and is the default: the check reads bin/deploy.sh and the tree AT the
      # commit under test, and asks git nothing about that commit's history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `bash` explicitly rather than relying on the executable bit surviving a checkout: the check
      # is the evidence, so it must fail on its own finding and never on a file mode.
      #
      # FIRST, because a check that no longer discriminates makes the step below meaningless (the
      # header says what it builds and changes). It needs no host, network or credential either.
      - name: Does the check itself still catch what it claims to?
        run: bash bin/deploy-gate-inputs.selftest.sh

      - name: Does this repository satisfy bin/deploy.sh phase A?
        run: bash bin/deploy-gate-inputs.sh --ref HEAD
