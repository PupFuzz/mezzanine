# fleet-reporter.yml — run the reporter's hermetic acceptance suite on every change to it.
#
# WHY IT EXISTS. `fleet-reporter.js` runs inside every hook fire on every agent machine in the
# fleet, and its three failure directions are all quiet: it blocks or crashes the seat (a hook
# exiting 2 is the harness's BLOCK signal, and hook stdout on SessionStart is injected into the
# MODEL'S context), it loses events without counting them (indistinguishable from a quiet seat,
# which is exactly what the floor renders when the fleet is calm), or it leaks a credential.
# None of those announces itself in review.
#
# WHY IT CAN RUN ON A PUBLIC RUNNER. The suite is hermetic: no network, no credential, no board.
# Its ingest is a TLS stub on 127.0.0.1 with a throwaway self-signed certificate, trusted
# through the reporter's own `ca_file` key — so the transport path is exercised with certificate
# verification ON, not proven by turning it off.
#
# THE SUITE IS RED-FIRST BY CONSTRUCTION, which is what makes a green run here mean anything:
# every safety property is driven against a deliberately defective copy of the reporter that
# MUST fail, and a plant whose anchor no longer matches raises rather than passing. A refactor
# that silently moves a planted line turns the job red instead of turning a RED into a GREEN.

name: fleet-reporter acceptance

on:
  pull_request:
    paths:
      - 'fleet-reporter/**'
      - '.github/workflows/fleet-reporter.yml'
      # The suite re-reads D1 § 6.1's `harness_label` pattern and example out of this file and
      # asserts them against each other and against what the reporter emits. That guard exists
      # because the doc's pattern once could not accept the value the doc itself mandates — and
      # the likeliest way it breaks again is an edit to THIS file, not to the reporter. Without
      # this path the drift check only runs on the side that did not drift.
      - 'docs/design/EVENT-SCHEMA.md'
      # AT-28's site stubs read the server's own rules: KindRegistry's kinds and RateLimiter's limits (read from
      # the files), and the store, replay memory and fold StateRecompute implements (mirrored by the stub). A
      # change to either side must run the suite that holds them together.
      - 'server/app/Ingest/**'
      - 'server/app/Fold/StateRecompute.php'
  push:
    branches: [dev, main]
    paths:
      - 'fleet-reporter/**'
      - '.github/workflows/fleet-reporter.yml'
      # The suite re-reads D1 § 6.1's `harness_label` pattern and example out of this file and
      # asserts them against each other and against what the reporter emits. That guard exists
      # because the doc's pattern once could not accept the value the doc itself mandates — and
      # the likeliest way it breaks again is an edit to THIS file, not to the reporter. Without
      # this path the drift check only runs on the side that did not drift.
      - 'docs/design/EVENT-SCHEMA.md'
      # AT-28's site stubs read the server's own rules: KindRegistry's kinds and RateLimiter's limits (read from
      # the files), and the store, replay memory and fold StateRecompute implements (mirrored by the stub). A
      # change to either side must run the suite that holds them together.
      - 'server/app/Ingest/**'
      - 'server/app/Fold/StateRecompute.php'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # The suite runs twice below (about 25 minutes each on a loaded host, measured for card#12180), so the bound
    # is generous; a run past it is hung, not slow.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # FULL HISTORY, because AT-28 Case F runs the PREVIOUS build (the reporter before card#12180,
          # read with `git show <commit>:fleet-reporter/fleet-reporter.js`) to write the state.json and spool
          # the upgrade is tested against. A shallow clone lacks that commit, and the suite then reports the
          # case NOT MEASURED rather than passing it.
          fetch-depth: 0

      # NO setup-node STEP, deliberately, matching how card-token-lint.yml treats python3: the
      # runner's stock `node` is the whole dependency, so there is no third-party action pin to
      # keep honest. The reporter targets Node >= 18 (D1 § 0) and uses no API newer than that,
      # and the suite's latency block measures the interpreter's own baseline on whatever
      # runner it lands on rather than assuming one — so a runner image bump moves the measured
      # baseline and the assertion with it, instead of silently invalidating a hard-coded number.
      - name: Record the interpreter the suite will measure against
        run: node --version && python3 --version && openssl version

      # The reporter's OWN install-time checks, run first and separately: they need no fixtures
      # from the suite, so an unconfigured checkout should still get the "is the sanitizer
      # sound, do the vendored fixtures still match what the code reads?" answer on its own.
      # It exits non-zero here because no config and no ingest are present, which is correct and
      # is why its verdict is read per check rather than from the exit code.
      - name: Reporter selftest (per-check verdicts; the two network checks are not measured here)
        run: |
          node fleet-reporter/fleet-reporter.js selftest > selftest.json || true
          python3 - <<'PY'
          import json, sys
          r = json.load(open('selftest.json'))
          offline = ['sanitizer_fixtures', 'predicate_discrimination', 'harness_payload_keys']
          bad = [c for c in offline if r['checks'][c] != 'pass']
          for c, v in r['checks'].items():
              print(f"  {c}: {v}")
          if bad:
              print(f"::error::offline selftest checks failed: {bad}")
              sys.exit(1)
          PY

      # THE INSTALLER'S SUITE (card#7336, card#12571), before the long one: it takes minutes, not tens of
      # them. It drives `install.js` in throwaway HOMEs against TLS stubs and a stub `crontab`: a fresh
      # install from a token file, a second run, upgrades from the layout install.sh left, rotation, sites,
      # uninstall, and each RED of D6 § 7 it owns. It records every exec of the install with strace, to show
      # the token in no argv or environment; the suite refuses to run without strace rather than skip that
      # check, so the step installs it when the image lacks it. R-lin-1 reads the runbook at 188e5fce from
      # this clone's history, which the full-history checkout above provides. Its docstring owns what it
      # proves; the `install-suite` job below runs it on Windows and macOS.
      - name: Install suite (hermetic — throwaway HOME, stub crontab, TLS stub on loopback)
        run: |
          command -v strace > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
          python3 fleet-reporter/install.selftest.py

      # The acceptance suite: RED plants for every safety property, then the real reporter.
      # Latency is MEASURED here and asserted in the step below, not this one — see
      # fleet-reporter/README.md § Decisions for the measurements behind that split.
      - name: Acceptance suite (hermetic — TLS stub on loopback, no credential, no network)
        run: python3 fleet-reporter/fleet-reporter.selftest.py

      # THE LATENCY GATE, ON ITS OWN, SEQUENTIALLY. P-5 is a real requirement and it does have a
      # gate — it just cannot share a run with anything else, because the measurement is
      # load-sensitive enough that a concurrent step turns it into a coin flip. Running it as a
      # separate step on an otherwise-idle job is what makes its verdict mean something. It
      # re-runs the WHOLE suite — the suite has no way to run the latency legs alone — which doubles the job's
      # time (about 25 minutes a run since card#12180's AT-28); that is the price of a number that can be trusted.
      - name: Latency gate (P-5, asserted — runs alone so the measurement is about the code)
        run: FLEET_REPORTER_PERF=1 python3 fleet-reporter/fleet-reporter.selftest.py

  # THE INSTALLER ON WINDOWS AND macOS (card#12571, D6 § 3.3 and § 7). `install.js` is one implementation for
  # three operating systems, and its Windows legs (the owner-only ACL through PowerShell and icacls, the
  # quoted forward-slash hook form, the installer's own flusher start, the roaming refusal) and its macOS legs
  # (the launchd plist and its loaded states against a stub `launchctl`, the gui-domain refusal, `ps` for
  # flusher control) only run on those runners. The suite is the same file the Linux job runs; each check
  # names the D6 id it implements, and the ids a runner cannot measure are printed NOT MEASURED there, never
  # passed (the strace leg is Linux's). The latency gate stays Linux-only. No setup-node or setup-python:
  # the runners' stock `node` and Python are the dependency, as in the job above.
  install-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Record the interpreter the suite will measure against
        run: |
          node --version && openssl version
          PY=$(command -v python3 || command -v python) && "$PY" --version

      - name: Install suite (hermetic — throwaway home, stub launchctl on macOS, TLS stub on loopback)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" fleet-reporter/install.selftest.py
