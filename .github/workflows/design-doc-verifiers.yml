# design-doc-verifiers.yml — point the design-surface gates at something, on every PR.
#
# WHAT IT DOES. Runs the three repo-only design verifiers over D1/D2/D3 (`verify-event-schema.py`,
# `verify-fleet-state.py`, `verify-floor.py`) and the ratified artifact's own gate
# (`floor-preview.selftest.mjs`) on every pull request, plus the plant harness that proves the
# three CAN red, and the state chip's colour gate (`state-chip-colours.py --selftest --check`,
# card#11218). Those are pure repo reads on stock `python3` / `node` — no credential, no network,
# no browser, no `setup-` step and no interpreter pin to keep honest. The `browser-smoke` job is the
# one exception, and pins what it installs (below).
#
# WHY IT EXISTS. Until card#7929 `tools/design/` was the one directory in this repository CI never
# entered: 246 KB of verification code referenced by ZERO workflows and ZERO hooks, while D1/D2/D3
# cited those tools as "reds the gate" in the PRESENT TENSE, some fifty times between them. The
# convention behind it was `tools/design/README.md`'s "run the verifier for a document before
# approving any change to it" — a runbook, which protects nobody who does not remember it. Every
# D-document PR merged so far merged on a gate that never fired. That is the false-clean shape the
# whole directory exists against, one layer up: the instrument exists, is correct, and was never
# pointed at anything. The sentences in D1/D2/D3 are made TRUE by this file rather than rewritten.
#
# ---------------------------------------------------------------------------------------------
# NO `paths:` FILTER — AND THE REASON IS MEASURED, NOT STYLISTIC.
# `paths: docs/design/**` is the obvious filter and it is WRONG, because these verifiers' read
# surface is wider than their subject. Measured while building this workflow: run
# `verify-event-schema.py` against a tree carrying only the four design documents and it reds,
# naming each path reference in `docs/VERSIONING.md` it cannot resolve — among them
# `../.github/workflows/release-pr-guard.yml` and `../bin/release-pr-guard.py` — because it
# resolves that file's path references and requires each to EXIST. (Its findings cite the
# VERSIONING line each reference sits on; those numbers move whenever that file is edited, so they
# are not reproduced here — the filenames are the example.) So a PR
# that deletes `bin/release-pr-guard.py`, or edits `docs/VERSIONING.md`, breaks D1's gate while
# touching nothing under `docs/design/`. Under a path filter that PR merges green and the next
# unrelated PR inherits the red.
#
# NO `branches:` FILTER — the reason `release-pr-guard.yml` records. A path- or branch-filtered
# workflow that produces NO RUN reads as PENDING for a required check, not passed, so filtering
# would deadlock every PR it filtered out wherever these contexts are required, and which contexts
# those are is a repository-settings fact this file does not restate — `docs/VERSIONING.md
# § Branch model` is its one home. Producing a completed run on every PR is what keeps a gate safe
# to require. `branches:` and `types:` are independent filters besides, so a base allowlist would
# also drop every event from a stacked PR.
#
# `synchronize` is the load-bearing type here: the subject is the DIFF, so every push to the head
# must be re-judged. `edited` is NOT subscribed — unlike `card-token-lint.yml`, no part of this
# gate's subject is PR metadata, so a retitle changes none of its inputs.
#
# ---------------------------------------------------------------------------------------------
# THE BROWSER SMOKE (card#12326) — the `browser-smoke` job below. card#12187 broke the lobby for
# every visitor and merged green, because nothing in CI had loaded a page in a browser. That job
# installs ONE pinned headless Chromium and runs `floor-ride.browser.mjs --row starts --selftest`:
# the lobby and a floor, each loaded once, red on any uncaught exception and on a page that never
# asks for its stream or never draws its first scene, with that row's own plants each required to
# red on the same checkout. It is the only browser row wired, and it drives no ride and no timing.
#
# WHAT IS DELIBERATELY NOT WIRED HERE, AND WHY — the gates in `tools/design/` named below.
# `verify-harness-facts.py` is fail-closed on a binary no runner carries, so wiring it reds every PR
# on correct work. The browser tools are fail-closed on a headless Chromium that a stock runner
# does not carry; the `browser-smoke` job shows one can be installed, and each of them stays absent
# until its own rows are shown to run clean and deterministic on a runner, which nobody has measured.
# card#12319's builder saw `floor-ride.browser.mjs`'s `arrival-doors` and `opt-in` rows flip under
# load. A gate that reds on correct work gets disabled, which costs more than the hole it closes.
#
#   `verify-harness-facts.py`  — re-derives D1's harness facts from the INSTALLED Claude Code
#       binary that D1 declares as its capture build. No runner has one. Being fail-closed is the
#       tool being RIGHT (card#7930 fixed its resolution; it is green at dev head on a machine
#       that has the build), so the gap is the runner's, not the tool's. Closing it needs a
#       decision about publishing ground truth that a runner can read — its own card, not this one.
#   `floor-preview.browser.mjs` — drives headless Chromium, resolved from `--chrome`, `$CHROME`
#       or `~/.cache/ms-playwright` and a FAILURE (never a skip) when absent. A stock
#       `ubuntu-latest` satisfies none of those three, and pointing `$CHROME` at a runner path
#       this change cannot verify is exactly the assumption that would red-lock CI.
#   `lobby-directory.browser.mjs` — the same browser, resolved the same way (card#7343's
#       `lobby-label-contrast.browser.mjs`, re-aimed at the lobby directory by card#12113): absent for the
#       same reason.
#   `floor-chrome.browser.mjs` — the same browser, resolved the same way (card#11045): absent
#       for the same reason, and it also runs `php` to render the floor view it lays out.
#   `floor-fixture.browser.mjs --selftest` — the same browser, resolved the same way (card#11144):
#       absent for the same reason, and it also runs `php` to render the floor view it draws in.
#   `floor-ride.browser.mjs --selftest`, every row but `starts` — the same browser, resolved the same
#       way (card#11795): absent for the same reason. Its `starts` row is the `browser-smoke` job.
#   `sleeper-zs.browser.mjs` — the same browser, resolved the same way (card#12187): absent for
#       the same reason.
#
# ⛔ NONE IS WIRED AS A SKIP. The card's own argument: an "N/A" that reads green re-mints this
# very defect one layer down — a check reported as passed that never ran. They are absent and
# NAMED, here and in `tools/design/README.md`, which is the surface a reader checks.

name: Design-doc verifiers

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  # D1/D2/D3 — the three document gates, plus the harness that proves they can red — and the state
  # chip colour gate, which reads the stylesheet rather than a document but shares this job's stock python3.
  design-docs:
    runs-on: ubuntu-latest
    steps:
      # Full history is not needed, but the `.git` directory IS: the plant harness enumerates its
      # population with `git ls-files` rather than walking the tree, so that it copies exactly
      # what CI checked out and not `__pycache__` or editor droppings.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The prove-it-can-fail harness runs HERE, against THIS checkout — the same bytes about to
      # judge somebody's PR. It plants a defect of the class each targeted guard exists for — a
      # stated figure drifting from what re-derives it, or a name renamed on a surface the gate is
      # supposed to hold (card#9303) — and requires the verifier to reject it, with the red
      # attributable to the plant rather than to any nonzero exit. It also plants HOLDS, correct
      # forms a wrong gate would red on, and requires that no new failure of that gate appears and
      # that the verifier neither crashes nor exits above the control on them (card#9320). How many
      # of each and of which kinds is printed by the harness on its own last line rather than
      # restated here.
      # The NAME is what shows in the CI UI, so it carries no count either: "per verifier" was
      # already false once the second plant against `verify-fleet-state.py` landed (card#9303).
      - name: Self-test (planted defects that must red and correct forms that must not, each verdict attributed to its plant — the harness prints how many on its own last line)
        run: python3 tools/design/verify-design-docs.selftest.py

      # Three separate steps, each `!cancelled()` DELIBERATELY and UNIFORMLY: these three gates
      # are independent of one another AND of the self-test, so failing fast would report one red
      # and leave the author to discover the other two on the next round. One push, every verdict.
      # The self-test is a precondition for TRUSTING these verdicts, never for producing them —
      # a red harness means "the proof that D1's gate can fail is broken", which is worth knowing
      # alongside D1's actual verdict rather than instead of it. The job still fails if any step
      # does; `!cancelled()` changes what gets REPORTED, never what passes.
      - name: D1 — EVENT-SCHEMA.md
        if: ${{ !cancelled() }}
        run: python3 tools/design/verify-event-schema.py

      - name: D2 — FLEET-STATE.md
        if: ${{ !cancelled() }}
        run: python3 tools/design/verify-fleet-state.py

      - name: D3 — FLOOR.md
        if: ${{ !cancelled() }}
        run: python3 tools/design/verify-floor.py

      # The state chip's fills, read from the sheet (card#11218): `--check` reds, naming each pair, when
      # any pair involving a quiet state (stale, offline, disabled) falls under the tool's ΔE2000 bound —
      # as the tokens, as the hollow chip's edge or as drawn over either plank course, in normal vision or
      # any of the three dichromacies. `--selftest` runs first in the same invocation and carries the
      # tool's own planted controls, so the acceptance `--check` applies is proven able to red on this
      # very checkout. Stdlib-only `python3`. Independent of the document gates, hence `!cancelled()`.
      - name: State chip colours (the sheet's quiet-state fills stay apart, with the tool's own planted controls)
        if: ${{ !cancelled() }}
        run: python3 tools/design/state-chip-colours.py --selftest --check

  # The ratified artifact. A SEPARATE JOB, not a step above: it judges CODE
  # (`docs/design/floor-preview/floor-preview.html`) rather than a document, it runs on a
  # different interpreter, and a red in either job should never hide the other's verdict.
  #
  # It needs no plant harness of its own — unlike the three above it carries its own planted
  # controls internally and prints the counts on its own last line every run ("N checks, M planted
  # controls" — the figures are computed there and deliberately not restated here), so
  # the proof travels with the tool. Wiring it is what puts the SHIPPED ARTIFACT under a gate for
  # the first time; before this it was verified by whoever remembered to open the file.
  design-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Stock `node` and zero dependencies: the gate imports only `node:` builtins and evaluates
      # the artifact's own script in a `node:vm` stub DOM. No package.json, no npm install.
      - name: Artifact gate (floor-preview.html, with its own planted controls)
        run: node tools/design/floor-preview.selftest.mjs

  # THE BROWSER SMOKE (card#12326). The lobby (`/dashboard`) and a floor (`/floor/aimla`), each loaded
  # once in headless Chromium, as the served markup (`render-floor-view.php` renders each view through
  # the layout, so it needs `php` and `server/`'s composer install, and no database and no `.env`), the
  # shipped `server/public` modules, and `floor-ride.browser.mjs`'s fixture run answering `/api/`. The
  # row reds on any uncaught exception the DevTools protocol reports (`Runtime.exceptionThrown`, the event
  # Playwright's `pageerror` is built on), on a page that never asks for its stream, and on one that draws
  # no scene. `--selftest` re-runs it under each of its plants, the card#12187 defect among them, and
  # requires each to red, so a green here also says the row could fail on this checkout.
  #
  # ⛔ NO RETRY. The row drives no ride, no input and no animation timing, so a red is a real
  # failure; a retry would hide the page that throws one load in three.
  # A SEPARATE JOB: it needs PHP, Node and a browser the other jobs do not, and a red here should
  # never hide their verdicts.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ⭐ THE PINNED BROWSER. Playwright 1.63.0 installs Chrome Headless Shell 153.0.8010.12
      # (Playwright's browser revision 1243) into `~/.cache/ms-playwright`. Only Playwright's installer
      # is used: the tool drives the browser over the DevTools protocol itself, with no npm dependency.
      # To move the pin, change both lines together; the version step reds when they disagree.
      PLAYWRIGHT_VERSION: 1.63.0
      CHROME_VERSION: 153.0.8010.12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The same PHP and composer steps `php-tests.yml` runs, without its MariaDB: the views render
      # with no request, session or database behind them.
      - name: Derive the PHP floor from server/composer.json, and check it against the lock
        id: php-floor
        run: python3 tools/verify-php-floor.py --github-output

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ steps.php-floor.outputs.minor }}
          coverage: none
          tools: composer:v2

      - name: Locate composer's download cache
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-

      - name: Install dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress

      # Node 22 is pinned because the browser tools use the platform's global `WebSocket`, which
      # Node 20 does not have.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22.22.1

      - name: Install the pinned headless Chromium
        run: npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps --only-shell chromium

      # The browser the row will run, read back from the binary itself: a cache holding anything but
      # the one pinned build reds here, by name, before any page is judged. That binary is then handed
      # to the row as `$CHROME`, so the row runs exactly the build this step read.
      - name: The browser is the pinned build
        run: |
          shell=$(ls -d "$HOME"/.cache/ms-playwright/chromium*/chrome-headless-shell-linux64/chrome-headless-shell)
          printf '%s\n' "$shell"
          version=$("$shell" --version)
          printf '%s\n' "$version"
          case "$version" in
            *" $CHROME_VERSION") ;;
            *) echo "::error::the headless Chromium is not the pinned $CHROME_VERSION: $version"; exit 1 ;;
          esac
          echo "CHROME=$shell" >> "$GITHUB_ENV"

      - name: The lobby and a floor start (no uncaught exception, the stream asked for, a scene drawn), with the row's own planted controls
        run: node tools/design/floor-ride.browser.mjs --row starts --selftest
