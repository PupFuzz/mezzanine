# php-tests.yml — actually run `server/`'s PHPUnit suite, on every PR and on every push to a
# long-lived branch. card#7344's PHP half.
#
# ⭐ TWO JOBS, TWO ENGINES, ONE SUITE — read both headers. `php-tests` (below) is the SQLite lane
# this file was created as and describes itself in the paragraphs that follow. `php-tests-mariadb`
# (at the foot of the file) runs the same `composer test` against the store production actually
# runs, and carries its own header. Everything between here and that job is about the SQLite lane
# unless it says otherwise.
#
# WHAT IT DOES. Installs PHP with `pdo_sqlite`/`sqlite3`, restores composer's download cache,
# installs `server/`'s dependencies from `composer.lock`, makes a `.env` from the committed
# template, mints an `APP_KEY`, and runs **the repo's own `composer test` script** —
# `artisan config:clear` then `artisan test`. It does not spell out a phpunit command line:
# `server/composer.json` already owns what "run the tests" means here, and a second spelling in
# CI is a second thing to keep in step with it.
#
# WHY IT EXISTS. Until this landed, **nothing in CI executed a single line of PHP.** The suite
# under `server/tests/` was run only by whoever remembered to run it, which means every
# `php artisan test` figure in a PR body on this repo was self-attested and unreproducible.
#
# ⚠ THE COST IS ALREADY REALISED, NOT PREDICTED — read `docs/CHANGELOG.md`'s card#8075 entry.
# `Tests\Feature\Feed\SeatObjectMatchesTheDocumentTest` sat RED on `dev` for days: D2 § 8.2.1
# declared `blocked_since` and `App\Read\SeatObject` did not carry it — a contract a consumer
# could read and the server never answered. The guard that catches it had been written, had
# been merged, and was failing the whole time; it was found because one agent happened to run
# the suite by hand. A guard nothing runs is not a guard, and this file is the thing that runs
# it.
#
# NO `paths:` FILTER, AND HERE THAT IS MEASURED RATHER THAN INHERITED. The house argument
# applies (`asset-provenance.yml`: a path-filtered workflow produces NO RUN, which as a required
# check reads *pending*, never *passed*) — but this suite has a second, concrete reason:
# **it reads outside `server/`.** `SeatObjectMatchesTheDocumentTest` opens
# `base_path('../docs/design/FLEET-STATE.md')` and compares § 8.2.1's field table to the wire
# object. A `server/**` filter would therefore be DARK on a docs-only PR that edits that
# table — which is one of the two ways the card#8075 gap could have been minted, and the half a
# reviewer is least likely to catch by eye.
#
# ⛔ WHETHER A RED HERE BLOCKS A MERGE IS NOT STATED IN THIS FILE, DELIBERATELY. A required-check
# list is a repository-settings fact that no file in the checkout can verify, and copies of it in
# workflow headers have already gone stale in this repo, in the direction that tells a reviewer to
# ignore a red. `docs/VERSIONING.md § Branch model` is its one home and carries the command that
# re-derives it from the API. Read that; do not re-copy it here.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS LANE DELIBERATELY DOES **NOT** COVER.
#
#   * **The JS half of card#7344.** `server/package.json` declares exactly two scripts, `build`
#     and `dev`; no JS test framework is installed anywhere in `server/`. A JS *test* lane would
#     have nothing to run and would be decoration. A `npm ci && npm run build` lane WOULD be
#     meaningful — but `server/package-lock.json` does not exist and `npm ci` requires one, and
#     minting a lockfile is a dependency-pinning decision on its own, not a side effect of adding
#     a test lane. That half of the card stays open.
#
#   * **Any PHP but the one the floor names.** The version is DERIVED from
#     `server/composer.json`'s `require.php`, by `tools/verify-php-floor.py`, and is not written
#     anywhere in this file. card#9203 is what the hand-written copy cost: `composer.json` said
#     `^8.3`, `composer.lock` needed `>=8.4.1`, `bin/deploy.sh` reloaded `php8.3-fpm`, and this
#     lane's own first run is what measured the disagreement (`composer install` exit 2, eighteen
#     *"your php version (8.3.33) does not satisfy"* problems). That card raised the floor and
#     this lane stopped spelling one out: it now runs whatever `server/composer.json`'s
#     `require.php` names, and moves when that moves. Read the value there, never here.
#     ⚠ **What that does not cover, stated rather than left to be inferred.** The pin is the
#     floor's MINOR, so the runner installs the newest patch on that line and nothing here ever
#     executes the exact minimum the declaration promises. That gap is closed STATICALLY rather
#     than by a patch-level pin: `tools/verify-php-floor.py` reds when any package in
#     `composer.lock` needs MORE than the declaration promises — the same defect a runner pinned
#     to the exact minimum would surface — without freezing this lane on a PHP that has stopped
#     receiving security patches, and without depending on `setup-php` resolving an exact patch
#     level.
#     Widening to several versions means a matrix, and a matrix multiplies the check CONTEXT
#     (`php-tests (8.4)`, `php-tests (8.5)`, …) — a required-check-list question, not a free
#     change. One version, one context, on purpose.
#
#   * **TLS, the session time zone, and concurrency on the store.** ⚠ This bullet USED to say the
#     store itself was uncovered; since card#9250 it is not. A second job, `php-tests-mariadb`,
#     runs every migration and the whole suite against a pinned MariaDB service container — see
#     its own header, which owns that argument. What is still uncovered is the rest of § 6.1's
#     posture: the container is plaintext on loopback, so the TLS requirement is not exercised;
#     `server/config/database.php` sets no session `timezone`; and `FOR UPDATE SKIP LOCKED` and
#     the lost-update / ABBA orderings card#7523 lists need two connections working at once,
#     which a single-threaded suite does not produce. Those stay card#7523's, verified at
#     provisioning.
#
#   * **The front-end build.** The suite passes with no `node_modules` and no `public/build`
#     (measured on this tree), so there is no `npm` step here. If a test ever renders a `@vite`
#     directive it will fail on the missing manifest — which is this lane asking for a build step,
#     not a flake.
#
#   * **Coverage.** `coverage: none` — no xdebug/pcov is installed. Nothing in this repo consumes
#     a coverage number, and installing a coverage driver to produce one nobody reads costs every
#     run.

name: PHP tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # The job id is the status-check CONTEXT a ruleset matches — never the workflow's display
  # name. Keep it stable: renaming it silently un-requires the check wherever it is required.
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ⛔ THE FLOOR IS READ, NEVER RETYPED — card#9203. `server/composer.json`'s `require.php` is
      # the one place this repository states which PHP it runs on; `bin/deploy.sh` derives its
      # precondition from it and this lane derives its pin from it, so no copy exists to drift.
      # A retyped copy is precisely what failed: this file said 8.4 while composer.json said ^8.3
      # and the lock needed >=8.4.1, and every one of the three was internally consistent.
      #
      # The step does two things and reds on either: it CHECKS that the declared floor can carry
      # every package `composer.lock` pins (the invariant that was false, and that
      # `composer validate` does NOT check — see the tool's docstring), and it emits the version
      # for the step below. Running before `setup-php` is deliberate: `python3` is on the runner
      # image and PHP is not needed to read two JSON files, so a floor that cannot carry the lock
      # fails in seconds instead of after an install.
      - name: Derive the PHP floor from server/composer.json, and check it against the lock
        id: php-floor
        run: python3 tools/verify-php-floor.py --github-output

      # `pdo_sqlite` AND `sqlite3` are both load-bearing and neither is optional: the suite's
      # connection is SQLite (phpunit.xml) and it does not start without them.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ steps.php-floor.outputs.minor }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      # Ask composer where its cache lives rather than hardcoding `~/.composer/cache`: the path
      # moved once already (XDG), and a cache step pointed at the wrong directory does not fail —
      # it silently caches nothing and reports a hit rate of zero that nobody looks at.
      - name: Locate composer's download cache
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Keyed on the LOCK, not on composer.json: the lock is what `composer install` reads, so a
      # composer.json edit that does not move the lock must not invalidate the cache. The PHP
      # version is in the key because dist archives are resolved per platform.
      - name: Restore composer's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-

      # The OTHER half of card#9203's invariant, and the half `tools/verify-php-floor.py` does
      # not do: composer's own content hash, which reds when `composer.json` has moved and the
      # lock was not regenerated. `--no-check-publish` because this package is never published to
      # a registry, so the publish-readiness rules say nothing about it; `--strict` so a warning
      # is a failure rather than a line in a log nobody reads. Seen to fail on this tree before it
      # was added: edit the php constraint, skip `composer update --lock`, and it exits 2.
      #
      # ⚠ It is NOT the floor check. It was CLEAN for the whole time card#9203's defect was live:
      # the hash matched, and composer.json's declared platform simply could not install the lock.
      - name: The lock must be in step with composer.json
        working-directory: server
        run: composer validate --strict --no-check-publish

      # No `--no-dev`: phpunit, collision, mockery and faker are all require-dev, and they are
      # the suite. `composer install` (never `update`) so the lock is the authority — a lane that
      # resolved fresh dependencies would be testing a tree nobody has.
      #
      # This runs BEFORE `.env` exists, which is the order `server/composer.json`'s own `setup`
      # script uses. The `post-autoload-dump` hook (`artisan package:discover`) boots the
      # framework, and it does so happily with no `.env` — verified on this tree rather than
      # assumed.
      - name: Install dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress

      # `.env.example` is the committed template and is the only one of the pair in git; nothing
      # in `composer install` creates `.env` for an existing checkout.
      - name: Create .env
        working-directory: server
        run: cp .env.example .env

      # ⛔ ASSERTED, NOT EXPORTED — the difference is the whole point.
      #
      # `server/phpunit.xml` leaves `DB_CONNECTION` deliberately UNFORCED (its own comment says
      # why: forcing it is the shape that turned another repo's MariaDB matrix into a SQLite run
      # reporting green). ⚠ Since card#9250 one lane in this file DOES export it — the
      # `php-tests-mariadb` job — and that is the point of the omission, not a violation of it:
      # an unforced declaration is what lets an export win. This lane must still ASSERT rather
      # than export, and now for a sharper reason than before. `.env.example` is the only thing
      # that selects SQLite here, so an `export DB_CONNECTION=sqlite` would pin this lane to
      # SQLite no matter what the template said — and the template moving is exactly the change
      # this step exists to catch.
      #
      # So this lane reads the backend it is about to run on and REDS if it is not what this
      # header claims. Flip `.env.example` to mysql and this step fails by name, instead of the
      # suite silently running somewhere else — or, worse, appearing to.
      - name: Assert the backend this lane claims to run on
        working-directory: server
        run: grep -qx 'DB_CONNECTION=sqlite' .env || { echo "::error::server/.env.example no longer sets DB_CONNECTION=sqlite — this lane, and this workflow's header, describe a SQLite run. Fix one or the other."; grep -n '^DB_CONNECTION=' .env; exit 1; }

      # `.env.example` ships `APP_KEY=` empty on purpose (it is a template and may never carry a
      # real value), and the encrypter throws without one.
      - name: Generate an application key
        working-directory: server
        run: php artisan key:generate

      # The repo's own entry point, not a hand-rolled phpunit invocation. `config:clear` is the
      # first half of that script and it is not ceremony: a stale `bootstrap/cache/config.php`
      # outranks every `<env>` in phpunit.xml, which is how a suite ends up asserting against a
      # configuration nobody can see.
      - name: Run the test suite
        working-directory: server
        run: composer test

  # ═════════════════════════════════════════════════════════════════════════════════════════
  # THE SECOND ENGINE. card#9250.
  #
  # Same suite, same lock, same PHP — a DIFFERENT STORE. Until this landed, **no migration in
  # this repository had ever been executed against the engine it runs on.** The suite is SQLite
  # (`server/phpunit.xml`), the job above asserts SQLite by name, and production is MariaDB
  # (`docs/PLAN.md` D-15 as amended 2026-09-09). Laravel does not paper over that: SQLite has no
  # native `ENUM` and its grammar REBUILDS a table where MySQL/MariaDB emits `ALTER … MODIFY`,
  # so the two are different framework code and only one of them was ever executed here. A
  # migration that passes the lane above and fails on MariaDB is discovered AT DEPLOY, and
  # MariaDB has no transactional DDL — a multi-statement migration halts PART-APPLIED with no
  # automatic rollback, and `bin/deploy.sh` is forward-only by design.
  #
  # ⛔ THIS IS AN ADDITIONAL LANE, NOT A CHANGED ONE, and that is card#9250's ruling rather than
  # a preference. The job above keeps its `DB_CONNECTION=sqlite` assertion untouched: that step
  # is not a configuration step, it is the guard that reds when `.env.example` moves under it,
  # and weakening it to make room here would remove the only thing standing between that lane
  # and a silent backend change. The two jobs share nothing but the checkout.
  #
  # HOW THE BACKEND IS SELECTED, and why it is an EXPORT. `server/phpunit.xml` declares
  # `DB_CONNECTION` **unforced**, deliberately, and `docs/design/FLEET-STATE.md § 6.2` finding 1
  # is why that works: an unforced `<env>` beats `.env`, and what beats the unforced `<env>` is a
  # variable already exported into the environment. So the `env:` block below is the mechanism,
  # not a convenience — it is the one lever that moves the suite's store, and `phpunit.xml`'s own
  # comment ("when something does, it must win") is now describing this job. Every other § 6.2
  # pin — `DB_DATABASE`, `DB_URL`, the two Redis databases — is `force="true"` + `<server>` and
  # therefore DEFEATS this export, which is the designed behaviour and is asserted by
  # `Tests\Feature\DatabasePinTest` and by `Tests\TestCase`'s resolved-value guard.
  #
  # ⚠ WHAT THIS LANE STILL DOES NOT COVER, stated rather than left to be inferred:
  #   * **TLS and the session time zone.** § 6.1 requires a verified-certificate connection and
  #     `SET time_zone = '+00:00'` on every connection. This service container is plaintext on
  #     loopback and `server/config/database.php` sets no `timezone`, so neither is exercised
  #     here; both remain card#7523's, verified at provisioning.
  #   * **`down()`.** Only `up()` runs. That is not an oversight: `bin/deploy.sh` is forward-only
  #     ON PURPOSE (a failed MariaDB migration is half-applied and a rollback is a second guess
  #     at an unknown state), so a `down()` defect is not on any production path. It stays
  #     unexercised, and card#9250 records that it does.
  #   * **Concurrency.** `FOR UPDATE SKIP LOCKED`, the `Predicates::record()` lost update and the
  #     ABBA ordering card#7523 names all need two connections doing real work at once. This lane
  #     runs the same single-threaded suite; a real engine is a precondition for testing them,
  #     not the test.
  # ═════════════════════════════════════════════════════════════════════════════════════════
  php-tests-mariadb:
    runs-on: ubuntu-latest

    # ⛔ THE TAG IS A LITERAL BECAUSE IT CANNOT BE ANYTHING ELSE — `services:` is resolved before
    # the first step runs, so no step output can reach it and `docs/design/FLEET-STATE.md § 6.1`'s
    # floor cannot be interpolated here. The copy is therefore GUARDED rather than deleted:
    # `tools/ci-store-probe.php` parses § 6.1's engine row and reds when the live server is below
    # it, so raising the floor without raising this tag fails by name instead of quietly
    # certifying migrations on an engine below what production is promised.
    #
    # Pinned to the floor EXACTLY (not `11.8`, not `lts`): the point of this lane is to execute
    # the minimum the document promises, and a floating tag tests whatever happened to be newest
    # on the day. Contrast the PHP pin above, which is the floor's MINOR by design — there the
    # exact-minimum gap is closed statically by `tools/verify-php-floor.py`, and no such static
    # check exists for a database server.
    #
    # No root password at all rather than a fake one: an ephemeral loopback container on a
    # single-use runner has nothing to protect, and a literal credential in a public workflow
    # file is a thing every future reader has to keep deciding is not real.
    services:
      mariadb:
        image: mariadb:11.8.6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mezzanine_test
        ports:
          - 3306:3306
        # `healthcheck.sh` ships inside the official image. `--innodb_initialized` rather than a
        # bare ping: the server accepts connections before InnoDB has finished coming up, and a
        # migration fired into that window fails in a way that reads like a migration defect.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24

    # Read by BOTH the application (Laravel's `env()`) and `tools/ci-store-probe.php`, on purpose:
    # one source for the address means the probe cannot certify a server the suite never used.
    # `DB_DATABASE` is § 6.2's pinned test database and matches `MARIADB_DATABASE` above — the
    # suite's own copy of it is the forced pin in `phpunit.xml`, which this export does not and
    # must not move.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: mezzanine_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same derivation as the lane above, same reason: the floor is read from
      # `server/composer.json`, never retyped (card#9203).
      - name: Derive the PHP floor from server/composer.json, and check it against the lock
        id: php-floor
        run: python3 tools/verify-php-floor.py --github-output

      # ⛔ `pdo_mysql` AND NOT `pdo_sqlite`, and the omission is load-bearing. If anything in this
      # lane ever resolves back to the sqlite connection — a missed export, a forced pin, a test
      # that opens it explicitly — it must fail loudly on a missing driver rather than quietly
      # run the whole suite on the engine this job exists to stop testing on. § 6.2 finding 4 is
      # what that silence costs: green, and testing nothing.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ steps.php-floor.outputs.minor }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Locate composer's download cache
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Deliberately the SAME key as the lane above: the two jobs install the same lock on the
      # same PHP, so they want the same dist archives. The store is not part of what composer
      # downloads.
      - name: Restore composer's download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ steps.php-floor.outputs.minor }}-

      # No `composer validate` here. It is a static check on two files that do not differ between
      # the two jobs, the lane above already runs it, and a second copy is a second thing to keep
      # in step for no second finding.
      - name: Install dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist --no-progress

      # The template still says `DB_CONNECTION=sqlite` and is COPIED UNCHANGED — the `env:` block
      # above is what moves the store. Editing `.env` here would make this lane's backend depend
      # on a file edit the lane above asserts against, and the two would fight.
      - name: Create .env
        working-directory: server
        run: cp .env.example .env

      - name: Generate an application key
        working-directory: server
        run: php artisan key:generate

      # ⭐ THE CONTROL HALF. A measured-empty schema is what makes the measured-non-empty one
      # after the migration mean anything; without it "there are tables" is satisfied by tables
      # that were already there. It also gates on the engine and on § 6.1's version floor, so a
      # wrong server fails here rather than three steps later inside a migration error.
      - name: The store is MariaDB at the pinned floor, and it is empty
        run: php tools/ci-store-probe.php --expect-tables=none

      # ⭐ THE CARD. Every migration in `server/database/migrations/`, run against the engine it
      # will actually run on, for the first time in this repository's history. `--force` because
      # artisan's destructive-command guard prompts without it on a non-interactive runner.
      - name: Run every migration against MariaDB
        working-directory: server
        run: php artisan migrate --force

      - name: The migrations landed on MariaDB
        run: php tools/ci-store-probe.php --expect-tables=some

      # The control half again, for the suite this time. `db:wipe` empties the schema so that the
      # check AFTER `composer test` can only pass if the suite itself migrated into MariaDB —
      # which is the only available proof that the suite resolved to this store, because the
      # suite selects its backend through `phpunit.xml` plus the export above and nothing outside
      # the PHP process can observe that choice directly.
      - name: Empty the schema so the suite's own migration is the thing measured
        working-directory: server
        run: php artisan db:wipe --force

      - name: The schema is empty again before the suite runs
        run: php tools/ci-store-probe.php --expect-tables=none

      # The repo's own entry point, exactly as the lane above runs it. What differs between the
      # two jobs is the environment, not the command.
      - name: Run the test suite
        working-directory: server
        run: composer test

      - name: The suite ran against MariaDB, not against SQLite
        run: php tools/ci-store-probe.php --expect-tables=some
