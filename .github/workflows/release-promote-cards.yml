# release-promote-cards.yml — make board 14's "Released to main" stage reachable.
#
# WHAT FIRES IT. A push to `main` — i.e. a release PR landing — plus a manual
# `workflow_dispatch` that is DRY-RUN by default, so an operator can exercise the whole path
# without moving a card.
#
# WHAT IT DOES. `bin/promote-cards-by-token` reads the commit subjects newly reachable on
# `main`, pulls every `card#<id>` token out of them, and moves those board-14 cards from
# "Shipped to dev" to "Released to main". Board id and both stage-id sets come from
# `.release-pr.json`; the API base and the host pin come from repo VARIABLES; the credential
# comes from a repo SECRET. Nothing about the board is spelled in this file.
#
# WHY THE TOKEN MOVER AND NOT THE TOOLKIT'S GENERIC ONE. Owned in ONE place, and only one:
# `bin/promote-cards-by-token`'s own header, § WHY THIS MOVER AND NOT THE TOOLKIT'S GENERIC ONE.
# Read it there. It is deliberately NOT restated here: the summary that used to sit on these
# lines had drifted into a false claim — that board 14's cards carry no `pr_number` stamp,
# when they do — which is precisely how a restatement fails.
#
# ISOLATED IN ITS OWN WORKFLOW ON PURPOSE, so a board hiccup can never block or red the
# release itself — this job is the last thing in the chain, not a gate on it.
#
# ⚠ IT CANNOT WORK UNTIL AN OPERATOR SETS THE SECRET AND THE TWO VARIABLES (docs/KANBAN.md
# § Operator setup). Until then it FAILS LOUDLY at the preflight below. That is deliberate:
# the alternative — skipping quietly when a credential is absent — is a release that silently
# stops promoting and a board that silently stops being true.

name: Promote released cards by card# token

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cards:
        description: 'Cards to promote (comma-separated ids or card#<id> tokens). Blank = derive from the released range.'
        required: false
        default: ''
      base:
        description: 'Override the derived range base (a tag or sha). Blank = derive it: the push `before` sha, else the previous release tag. Needed only when derivation is impossible or wrong — `main` was force-pushed, a shallow/tagless clone, or deliberately re-promoting an OLDER release. An un-derivable range exits 2 rather than guessing (docs/KANBAN.md G-2).'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — report only, move nothing.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-promote-cards-${{ github.sha }}
  cancel-in-progress: false

jobs:
  promote:
    # GitHub-hosted: this is a public repo with free CI and no self-hosted runner. The mover
    # is pure bash over git + curl + jq, all three stock on ubuntu-latest, so there is
    # nothing to install and no interpreter to pin.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + tags — the mover derives the released range from git history and
      # fail-closes on a shallow or tagless clone rather than guessing one.
      - name: Checkout (full history, with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # The mover's own hermetic acceptance suite: no network, no credential, no board. It
      # runs HERE, against THIS checkout, because a promote job's guarantees are only worth
      # something if the fixtures proving they can fail ran against the same bytes that are
      # about to write to a terminal board stage.
      - name: Self-test the mover (hermetic — stubbed curl, fixture git repo, no board)
        run: bash bin/promote-cards-by-token.selftest.sh

      # PREFLIGHT — turn every "not configured yet" into ONE clear ::error:: naming the exact
      # command that fixes it, instead of the mover's (correct, but less obvious) fail-closed
      # refusal in the next step. All three checks are emptiness tests on values this job
      # never prints: no secret value reaches the log, here or anywhere below.
      # It runs AFTER the self-test on purpose: the self-test needs no credential, so an
      # unconfigured repo should still get the "is the tool sound?" answer, not just "you
      # have not set the secret".
      #
      # The two VARIABLES are deliberately out-of-band from the PR-editable
      # `.release-pr.json` (whose api_base is a host-scrubbed placeholder). Both halves are
      # load-bearing: the expected host must not come from the file being validated (circular,
      # and worthless), and it must not be a literal in THIS file either — this file is
      # exactly as PR-editable as that one, so a single PR editing both to a lookalike host
      # would satisfy the guard and hand over the token. A repo variable takes repo-settings
      # write, which is outside the code-review plane.
      - name: Preflight — the secret and the two repo variables must exist
        env:
          KANBAN_WRITEBACK_TOKEN: ${{ secrets.KANBAN_WRITEBACK_TOKEN }}
          KANBAN_API_BASE: ${{ vars.KANBAN_API_BASE }}
          KANBAN_EXPECTED_HOST: ${{ vars.KANBAN_EXPECTED_HOST }}
        run: |
          set -euo pipefail
          rc=0
          if [ -z "${KANBAN_WRITEBACK_TOKEN:-}" ]; then
            echo "::error::secrets.KANBAN_WRITEBACK_TOKEN is not set — refusing to run. Set it with: gh secret set KANBAN_WRITEBACK_TOKEN --repo PupFuzz/mezzanine (a kanban API token whose user is a MEMBER of board 14 WITH move permission; a non-member token reads 0 cards and promotes nothing, silently). See docs/KANBAN.md."
            rc=1
          fi
          if [ -z "${KANBAN_API_BASE:-}" ]; then
            echo "::error::vars.KANBAN_API_BASE is not set — refusing to promote against the .release-pr.json placeholder host. Set it with: gh variable set KANBAN_API_BASE --repo PupFuzz/mezzanine --body 'https://<kanban-host>/api/v3'"
            rc=1
          fi
          if [ -z "${KANBAN_EXPECTED_HOST:-}" ]; then
            echo "::error::vars.KANBAN_EXPECTED_HOST is not set — the mover requires it to validate the api host BEFORE the writeback token is sent (there is no baked default). Set it with: gh variable set KANBAN_EXPECTED_HOST --repo PupFuzz/mezzanine --body '<kanban-host>'"
            rc=1
          fi
          exit $rc

      # ⛔ WHICH CREDENTIAL IS THIS, ACTUALLY — the check that was missing, and the whole cause
      # of card#9146. Every promote run from 2026-08-24 to 2026-09-09 died `✗ card#NNNN: move
      # failed (HTTP 403)` on every card, and four rounds of inference across two agents failed
      # to explain it, because every hypothesis was about the BOARD (role, custom permissions,
      # the destination stage's lane_type) and none about the CREDENTIAL. The secret held a
      # token for the WRONG kanban user. Measured, one variable at a time, on this very
      # workflow:
      #
      #   run 34417338664  identity probe -> user 10   promote -> ✗ card#9077 HTTP 403
      #   `gh secret list` -> KANBAN_WRITEBACK_TOKEN updated 2026-09-09T23:37:31Z
      #   run 34417760754  identity probe -> user 15   promote -> ✓ card#9078: moved 107 → 108
      #
      # The step above only asks whether the secret is NON-EMPTY, while its own ::error:: text
      # DECLARES a requirement about the token's USER that nothing checked — a declaration with
      # no check, which is worse than silence: it hands the next reader confidence where a
      # question was owed. This step is that check. It fails the job BEFORE the mover touches a
      # card, so a mis-rotated secret is named in one line instead of costing another four
      # rounds of board-permission archaeology.
      #
      # ⚠ IT PRINTS ONLY the HTTP status and `.data.id`. That endpoint also returns `name`,
      # `initials` and `email`; none of those belong in a job log.
      #
      # ⚠ THE BEARER HEADER RIDES STDIN (`-H @-`), NOT ARGV — the same idiom, for the same
      # reason, as the mover's own `api` helper: argv is world-readable via `ps aux`, and a
      # runner is not a reason to hold a credential differently than the tool next to it does.
      # `printf | curl` rather than a `<<<` herestring so the token never reaches a temp file
      # either.
      #
      # ⚠ NO HOST GUARD HERE, DELIBERATELY, and this is not an oversight to "fix" later. The
      # mover's `host_ok` exists for ONE threat: `.release-pr.json` is PR-editable and carries
      # an `api_base`, so a PR could redirect the token. This step never reads that file — it
      # sends only to `vars.KANBAN_API_BASE`, and the preceding step has already hard-failed
      # the job if that variable is empty, so the PR-editable path cannot be reached from here.
      # Re-stating `host_ok` in YAML would add no protection and would mint a third copy of a
      # guard whose two existing copies are only kept honest by being few.
      - name: Preflight — the secret must authenticate AS the declared writeback user
        env:
          KANBAN_WRITEBACK_TOKEN: ${{ secrets.KANBAN_WRITEBACK_TOKEN }}
          KANBAN_API_BASE: ${{ vars.KANBAN_API_BASE }}
        run: |
          set -euo pipefail
          # The expectation is BOARD STATE, so it lives with board_id and the stage ids in
          # .release-pr.json — not as a literal here. Unlike `api_base` this key cannot
          # redirect a credential anywhere: the worst a hostile edit to it achieves is a guard
          # that stops guarding, which is exactly the state this commit replaces.
          expected="$(jq -r '.promote.writeback_user_id // empty' .release-pr.json)"
          if [ -z "$expected" ]; then
            echo "::error::.promote.writeback_user_id is missing from .release-pr.json — this job cannot confirm which kanban user the writeback secret is. Put the expected numeric board user id there."
            exit 1
          fi
          code="$(printf 'Authorization: Bearer %s' "$KANBAN_WRITEBACK_TOKEN" \
                  | curl -sS -o /tmp/whoami.json -w '%{http_code}' \
                         -H @- -H 'Accept: application/json' \
                         "${KANBAN_API_BASE%/}/users/current.json" || echo 000)"
          if [ "$code" != "200" ]; then
            rm -f /tmp/whoami.json
            echo "::error::the writeback secret did not authenticate — GET /users/current.json returned HTTP $code. The token is malformed, revoked or expired; this is not a board-permission question. Re-issue it and: gh secret set KANBAN_WRITEBACK_TOKEN --repo PupFuzz/mezzanine. See docs/KANBAN.md § G-17."
            exit 1
          fi
          actual="$(jq -r '.data.id // "absent"' /tmp/whoami.json 2>/dev/null || echo unparseable)"
          rm -f /tmp/whoami.json
          echo "writeback identity: the secret authenticates as kanban user id=$actual (expected $expected)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the writeback secret authenticates as kanban user $actual, but .release-pr.json declares the writeback account is user $expected. Promoting with the wrong account is what made every card move 403 for three weeks (card#9146). Re-set the secret to the right account's token, or correct .promote.writeback_user_id if the account genuinely changed. See docs/KANBAN.md § G-17."
            exit 1
          fi

      - name: Promote cards named in the released range
        env:
          # A kanban API token whose user is a MEMBER of board 14 WITH move permission.
          # Unset ⇒ the mover exits 2 saying so; it never degrades to a no-op. Never echoed.
          KANBAN_WRITEBACK_TOKEN: ${{ secrets.KANBAN_WRITEBACK_TOKEN }}
          # Fail-closed host pin, checked BEFORE the token is sent: the mover refuses unless
          # api_base is https:// on this host or a subdomain of it, so a redirected or
          # rewritten api_base cannot exfiltrate the credential to another host.
          KANBAN_EXPECTED_HOST: ${{ vars.KANBAN_EXPECTED_HOST }}
          # Overrides `.release-pr.json`'s host-scrubbed placeholder. Changing this variable
          # is a credential-scope change; review it as one.
          KANBAN_API_BASE: ${{ vars.KANBAN_API_BASE }}
          # The push payload's `before` sha — what `main` pointed at BEFORE this push.
          # MEASURED, not inferred, so `before..after` is exactly what this push released, and
          # it is stable across a re-run of the same job. Empty on workflow_dispatch, where
          # the mover falls back to the previous release tag (or to --base).
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          INPUT_CARDS: ${{ github.event.inputs.cards }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          [ -n "${INPUT_CARDS:-}" ] && args+=(--cards "$INPUT_CARDS")
          [ -n "${INPUT_BASE:-}" ] && args+=(--base "$INPUT_BASE")
          [ "${DRY_RUN:-}" = "true" ] && args+=(--dry-run)
          bin/promote-cards-by-token "${args[@]}"
