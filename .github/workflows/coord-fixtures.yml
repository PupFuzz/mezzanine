# coord-fixtures.yml — the coordination fixtures are GENERATED, and this is what holds them to that
# (card#12239; `docs/design/COORD-STORE.md § 3.5`, which owns the rules).
#
# THREE STEPS, each a red on its own:
#   1. the guard's own controls — every plant (an edited generated byte, a deleted and an added file,
#      one hit per lint rule, a stale exemption pair, a pair naming the wrong rule, the capture tool's
#      two refusals and its signature strip) seen RED, then the committed tree GREEN;
#   2. `--check` — the committed `server/tests/fixtures/coord/generated/` tree byte-compared against a
#      fresh generation from `server/tests/fixtures/coord/spec.json`. Real content cannot come out of a
#      generator whose only inputs are the spec's enumerated values, so a hand edit, a stale file or a
#      pasted capture reds here on its first differing byte;
#   3. `--lint` — the NARROW lint (the operator's ruling of 2026-10-23): a delivery header name, or a
#      `FROM:`/`TO:` header line bare or quoted, in a test or tool file outside the generated tree and
#      the `(path, rule)` exemptions `tools/coord/lint-exemptions.txt` lists with their reasons.
#
# NO `paths:` FILTER, for the house reason `asset-provenance.yml` gives: a path-filtered workflow
# produces no run, which as a required check reads *pending*, never *passed* — and the lint's
# population is most of the tree.
#
# ⚠ WHAT IT CANNOT CATCH is COORD-STORE.md § 3.5's named list — a real value typed into the spec, a body
# whose header lines were stripped first, a literal split at runtime — and is not restated here.

name: Coordination fixtures

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  coord-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Self-test (every plant seen red; the committed tree green)
        run: python3 tools/coord/synthesize-fixtures.selftest.py

      - name: The committed fixtures are a fresh generation from the spec
        run: python3 tools/coord/synthesize-fixtures.py --check

      - name: The narrow lint over the test and tool tree
        run: python3 tools/coord/synthesize-fixtures.py --lint
